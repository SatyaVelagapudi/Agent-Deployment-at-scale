name: Deploy Spring Boot to AWS EKS using Helm

on:
  push:
    branches:
      - spPromptGeneratorAws

env:
  # IMPORTANT: Replace these placeholders with your actual values
  AWS_ACCOUNT_ID: "774305586623" # Your AWS account ID
  AWS_REGION: us-east-1
  AWS_CLUSTER_REGION: eu-north-1
  ECR_REPOSITORY: test-spring-boot-app
  EKS_CLUSTER_NAME: gen-ai-eks-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable (JpaGenerator)
        run: chmod +x gradlew
        working-directory: ./JpaGenerator

      - name: Build JpaGenerator (Gradle)
        run: ./gradlew clean build -x test
        working-directory: ./JpaGenerator

      - name: Make gradlew executable (SpPromptConverter)
        run: chmod +x gradlew
        working-directory: ./SpPromptConverter

      - name: Build SpPromptConverter (Gradle)
        run: ./gradlew clean build -x test
        working-directory: ./SpPromptConverter

      # Configure AWS Credentials using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }} # The IAM Role ARN from GitHub Secrets
          aws-region: ${{ env.AWS_CLUSTER_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to ECR
        run: |
          IMAGE_TAG=${{ github.sha }}
          # Build for linux/amd64 as EKS nodes typically use this architecture
          docker build --platform linux/amd64 -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG

      - name: Set ECR_REGISTRY env
        run: echo "ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> $GITHUB_ENV

      - name: Set Kubeconfig for EKS
        run: |
          # This command authenticates your runner's kubectl with your EKS cluster
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_CLUSTER_REGION }}
          
          # The Helm CLI is usually pre-installed on GitHub-hosted runners, so no 'install helm' step is needed.

      - name: Deploy to EKS with Helm
        run: |
          # This command installs or upgrades your application using the chart in the ./helm directory
          helm upgrade --install spring-app-release ./helm \
            --namespace default \
            --set image.repository=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }} \
            --set image.tag=${{ github.sha }}