name: Deploy Spring Boot to AWS EKS using Helm

on:
  push:
    branches:
      - spPromptGeneratorAws

env:
  # IMPORTANT: Replace these placeholders with your actual values
  AWS_ACCOUNT_ID: "774305586623" # Your AWS account ID here
  AWS_CLUSTER_REGION: eu-north-1
  JPA_ECR_REPOSITORY: jpagenerator
  SPC_ECR_REPOSITORY: sppromptconverter
  EKS_CLUSTER_NAME: gen-ai-eks-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication GITHub to AWS
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable (JpaGenerator)
        run: chmod +x gradlew
        working-directory: ./JpaGenerator

      - name: Build JpaGenerator (Gradle)
        run: ./gradlew clean build -x test
        working-directory: ./JpaGenerator

      - name: Make gradlew executable (SpPromptConverter)
        run: chmod +x gradlew
        working-directory: ./SpPromptConverter

      - name: Build SpPromptConverter (Gradle)
        run: ./gradlew clean build -x test
        working-directory: ./SpPromptConverter

      # Configure AWS Credentials using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }} # The IAM Role ARN from GitHub Secrets
          aws-region: ${{ env.AWS_CLUSTER_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR_REGISTRY env
        run: echo "ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com" >> $GITHUB_ENV

      - name: Build and push JpaGenerator image to ECR
        uses: docker/build-push-action@v4
        with:
          context: ./JpaGenerator
          file: ./JpaGenerator/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.JPA_ECR_REPOSITORY }}:${{ github.sha }}

      - name: Build and push SpPromptConverter image to ECR
        uses: docker/build-push-action@v4
        with:
          context: ./SpPromptConverter
          file: ./SpPromptConverter/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.SPC_ECR_REPOSITORY }}:${{ github.sha }}

      - name: Set Kubeconfig for EKS
        run: |
          # This command authenticates your runner's kubectl with your EKS cluster
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_CLUSTER_REGION }}
          
          # The Helm CLI is usually pre-installed on GitHub-hosted runners, so no 'install helm' step is needed.

      - name: Deploy to EKS with Helm
        run: |
          helm upgrade --install spring-app-release ./helm \
            --namespace default \
            --set jpaGenerator.image.repository=${{ env.ECR_REGISTRY }}/${{ env.JPA_ECR_REPOSITORY }} \
            --set jpaGenerator.image.tag=${{ github.sha }} \
            --set spPromptConverter.image.repository=${{ env.ECR_REGISTRY }}/${{ env.SPC_ECR_REPOSITORY }} \
            --set spPromptConverter.image.tag=${{ github.sha }}
